<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glow circle in upper right -->
  <circle cx="1050" cy="150" r="280" fill="#6366f1" fill-opacity="0.12" filter="blur(40px)" />
  <circle cx="200" cy="480" r="220" fill="#3b82f6" fill-opacity="0.08" filter="blur(50px)" />

  <!-- Brand Emblem -->
  <g transform="translate(100, 100)">
    <rect width="72" height="72" rx="20" fill="url(#primaryGrad)" />
    <!-- Radar ring -->
    <circle cx="36" cy="36" r="22" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="4 2" />
    <circle cx="36" cy="36" r="14" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8" />
    <circle cx="36" cy="36" r="6" fill="#ffffff" />
  </g>

  <!-- Title & Subtitle -->
  <text x="195" y="148" font-family="Inter, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
    StoreSight <tspan fill="#60a5fa">AI</tspan>
  </text>
  <text x="198" y="172" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="1">
    ENTERPRISE RETAIL VISION &amp; OPERATIONS
  </text>

  <!-- Tagline / Headline -->
  <text x="100" y="270" font-family="Inter, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">
    Production Retail Intelligence &amp; Loss Prevention
  </text>
  <text x="100" y="315" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Multi-camera real-time tracking, customer journey analytics, and automated loss triage.
  </text>

  <!-- Metric Badges -->
  <g transform="translate(100, 390)">
    <!-- Badge 1 -->
    <rect width="210" height="90" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="38" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">CAMERAS ONLINE</text>
    <text x="24" y="70" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#34d399">11 / 13 Active</text>

    <!-- Badge 2 -->
    <rect x="230" width="210" height="90" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="254" y="38" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">ACTIVE TRIAGE</text>
    <text x="254" y="70" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f59e0b">10 Incidents</text>

    <!-- Badge 3 -->
    <rect x="460" width="210" height="90" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="484" y="38" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">SYSTEM PIPELINE</text>
    <text x="484" y="70" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#60a5fa">32ms Latency</text>
  </g>

  <!-- Live Pulse Pill -->
  <g transform="translate(100, 525)">
    <rect width="180" height="34" rx="17" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#34d399" />
    <text x="34" y="22" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">LIVE SYSTEM HEALTH</text>
  </g>
</svg>
