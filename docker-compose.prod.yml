name: smartretail-ai-prod

services:
  # ── PostgreSQL Primary (Read/Write) ───────────────────────────
  postgres-primary:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartretail}
      POSTGRES_USER: ${POSTGRES_USER:-smartretail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartretail_prod_password}
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── PostgreSQL Read Replica ───────────────────────────────────
  postgres-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartretail}
      POSTGRES_USER: ${POSTGRES_USER:-smartretail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartretail_prod_password}
    ports:
      - "5433:5432"
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Redis (Active Carts, Sessions & Idempotency) ──────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_prod_password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_prod_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Apache Kafka (KRaft Mode: Edge Message Broker) ────────────
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── FastAPI Backend API ───────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
    image: smartretail-ai-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres-primary
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-smartretail}
      POSTGRES_USER: ${POSTGRES_USER:-smartretail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartretail_prod_password}
      POSTGRES_REPLICA_HOST: postgres-replica
      POSTGRES_REPLICA_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_prod_password}
      REDIS_MODE: standalone
      BROKER_BACKEND: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENTS_TOPIC: smartretail.edge.events
      KAFKA_DLQ_TOPIC: smartretail.edge.events.dlq
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Standalone Event Consumer Worker ──────────────────────────
  worker:
    build:
      context: ./apps/backend
    image: smartretail-ai-backend:latest
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres-primary
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-smartretail}
      POSTGRES_USER: ${POSTGRES_USER:-smartretail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartretail_prod_password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_prod_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENTS_TOPIC: smartretail.edge.events
      KAFKA_DLQ_TOPIC: smartretail.edge.events.dlq
      KAFKA_CONSUMER_GROUP: smartretail-worker-pool
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Edge AI Computer Vision Ingestion ─────────────────────────
  ai-services:
    build:
      context: .
      dockerfile: ./apps/ai-services/Dockerfile
    image: smartretail-ai-services:latest
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "apps.ai_services.service",
        "--camera",
        "CAM-01",
        "--source",
        "simulation",
        "--broker",
        "kafka",
        "--kafka-servers",
        "kafka:9092"
      ]
    depends_on:
      kafka:
        condition: service_healthy

  # ── Production Web Frontend (SPA + Nginx) ─────────────────────
  frontend:
    build:
      context: ./apps/frontend
    image: smartretail-ai-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_primary_data:
  pg_replica_data:
  redis_prod_data:
  kafka_prod_data:
