name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartretail
          POSTGRES_USER: smartretail
          POSTGRES_PASSWORD: smartretail
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U smartretail -d smartretail"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: smartretail
      POSTGRES_USER: smartretail
      POSTGRES_PASSWORD: smartretail
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r apps/backend/requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check apps tests database

      - name: Format (ruff format --check)
        run: ruff format --check apps tests database

      - name: Run tests (unit + integration)
        run: pytest
