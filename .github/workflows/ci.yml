name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  test-backend:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartretail
          POSTGRES_USER: smartretail
          POSTGRES_PASSWORD: smartretail
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U smartretail -d smartretail"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: smartretail
      POSTGRES_USER: smartretail
      POSTGRES_PASSWORD: smartretail
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/backend/requirements-dev.txt
          pip install aiokafka

      - name: Lint (ruff check)
        run: ruff check apps tests database

      - name: Format (ruff format --check)
        run: ruff format --check apps tests database

      - name: Run tests (unit + integration)
        run: pytest

  test-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/frontend/package.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci --prefer-offline

      - name: Build frontend SPA
        working-directory: apps/frontend
        run: npm run build

  build-and-push:
    name: Build & Push Container Images
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for AI Services
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-services
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & Push AI Services Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/ai-services/Dockerfile
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k8s:
    name: Trigger Kubernetes Rolling Update
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests with Kustomize
        run: |
          kubectl kustomize infrastructure/kubernetes/

      - name: Rolling update notification / dispatch
        run: |
          echo "Images successfully published to ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}."
          echo "Triggering automated rolling rollout for namespace smartretail..."
          # If KUBECONFIG secret is configured in the repo:
          # kubectl --kubeconfig <(echo "${{ secrets.KUBECONFIG }}") rollout restart deployment/smartretail-backend -n smartretail
          # kubectl --kubeconfig <(echo "${{ secrets.KUBECONFIG }}") rollout restart deployment/smartretail-frontend -n smartretail
          # kubectl --kubeconfig <(echo "${{ secrets.KUBECONFIG }}") rollout restart deployment/smartretail-worker -n smartretail
