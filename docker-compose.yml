name: smartretail-ai

services:
  backend:
    build:
      context: ./apps/backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TAG: ${BUILD_TAG:-dev}
    image: smartretail-ai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RELOAD: ${RELOAD:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Live mount so uvicorn --reload picks up code changes during development.
      - ./apps/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartretail}
      POSTGRES_USER: ${POSTGRES_USER:-smartretail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartretail_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Placeholder services (shape reserved so the file does not need redesign) ──
  #
  # worker:
  #   The background job worker (Celery/RQ-style) that will consume events from
  #   Redis Streams and drive asynchronous processing. Introduced in a later phase.
  #   build: ./apps/worker
  #   env_file: .env
  #   environment:
  #     POSTGRES_HOST: postgres
  #     REDIS_HOST: redis
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #
  # ai-services:
  #   CPU/GPU inference containers for detection, tracking, and re-identification.
  #   Added alongside Phase 3+; production deployment (Kubernetes) is deferred
  #   until Phase 19, per docs/architecture/overview.md.
  #   build: ./apps/ai-services
  #   env_file: .env
  #   depends_on:
  #     - postgres
  #     - redis

volumes:
  postgres_data:
    name: smartretail-postgres-data
  redis_data:
    name: smartretail-redis-data
