<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer radar ring -->
  <circle cx="32" cy="32" r="22" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 2" />
  <!-- Mid radar ring -->
  <circle cx="32" cy="32" r="14" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.7" />
  
  <!-- Core Camera Iris / Target -->
  <circle cx="32" cy="32" r="7" fill="url(#grad)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
  
  <!-- Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="12" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="52" x2="32" y2="58" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="6" y1="32" x2="12" y2="32" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="52" y1="32" x2="58" y2="32" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
</svg>
