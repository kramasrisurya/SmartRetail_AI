apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartretail-frontend
  namespace: smartretail
  labels:
    app.kubernetes.io/name: smartretail-frontend
    app.kubernetes.io/component: ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: smartretail-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartretail-frontend
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: frontend
          image: ghcr.io/kramasrisurya/smartretail-ai-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: smartretail
  labels:
    app.kubernetes.io/name: smartretail-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: smartretail-frontend
